<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QRIS Approve Simulator — PLANET VINYL</title>
  <style>
    :root {
      /* 1970s Supergraphics Palette (Sinkron dengan style.css) */
      --bg-cream: #F5E6CA;
      --bg-card: #FFF8EB;
      --bg-subtle: #EDD7B4;
      --text-dark: #2A1810;
      --text-muted: #684B39;
      --accent-orange: #D9531E;
      --accent-orange-hover: #B84012;
      --accent-gold: #E5A024;
      --accent-teal: #5B6E2D;
      --accent-teal-hover: #475721;
      --accent-rust: #9E341D;
      --accent-brown: #422518;
      --border-retro: #C9AE86;
      --shadow-retro: 5px 5px 0px #2A1810;
      --shadow-retro-sm: 3px 3px 0px #2A1810;
      --radius-70s: 18px;
      --radius-hero: 24px;
      --radius-pill: 999px;
      --green: #3B6E3C;
      --green-bg: #E7F3E4;
      --red: #B63826;
      --red-bg: #FBE9E5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Trebuchet MS', 'Gill Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-cream);
      background-image:
        radial-gradient(circle at 0% 0%, transparent 58px, rgba(217, 83, 30, 0.08) 59px, rgba(217, 83, 30, 0.08) 70px, transparent 71px),
        radial-gradient(circle at 0% 0%, transparent 74px, rgba(229, 160, 36, 0.11) 75px, rgba(229, 160, 36, 0.11) 86px, transparent 87px),
        radial-gradient(circle at 0% 0%, transparent 90px, rgba(91, 110, 45, 0.08) 91px, rgba(91, 110, 45, 0.08) 102px, transparent 103px),
        radial-gradient(rgba(158, 52, 29, 0.12) 1.5px, transparent 1.5px);
      background-size: 220px 220px, 220px 220px, 220px 220px, 26px 26px;
      background-position: 0 0, 0 0, 0 0, 13px 13px;
      color: var(--text-dark);
      line-height: 1.55;
      min-height: 100vh;
    }

    .groovy-stripe {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      height: 12px;
      width: 100%;
      border-bottom: 2.5px solid var(--text-dark);
    }

    .groovy-stripe span:nth-child(1) { background-color: #D9531E; }
    .groovy-stripe span:nth-child(2) { background-color: #E5A024; }
    .groovy-stripe span:nth-child(3) { background-color: #5B6E2D; }
    .groovy-stripe span:nth-child(4) { background-color: #9E341D; }

    .wrap {
      max-width: 740px;
      margin: 0 auto;
      padding: 1.75rem 1.25rem 3.5rem;
    }

    .head {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 96% 120%, #5B6E2D 0 56px, #E5A024 56px 82px, #D9531E 82px 108px, #9E341D 108px 134px, transparent 135px),
        linear-gradient(135deg, #2A1810 0%, #4A2919 65%, #5B331E 100%);
      color: var(--bg-cream);
      border: 3px solid var(--text-dark);
      border-radius: var(--radius-hero);
      box-shadow: 6px 6px 0px var(--text-dark);
      padding: 1.35rem 1.5rem;
      margin-bottom: 1.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .head-brand {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 0.9rem;
    }

    .head-logo {
    height: 74px;
    width: 74px;
    max-width: none;
    max-height: none;
    object-fit: contain;
    display: block;
    flex-shrink: 0;
    }

    .head h1 {
      font-family: 'Cooper Black', 'Rockwell', 'Bookman Old Style', Georgia, serif;
      font-size: 1.45rem;
      color: var(--accent-gold);
      text-shadow: 2px 2px 0px var(--accent-orange);
      letter-spacing: 0.6px;
      line-height: 1.15;
    }

    .head p {
      font-family: 'Courier New', monospace;
      font-size: 0.76rem;
      color: #E8D5B7;
      letter-spacing: 0.8px;
      margin-top: 0.2rem;
    }

    .live-pill {
      position: relative;
      z-index: 1;
      font-family: 'Courier New', monospace;
      font-size: 0.76rem;
      font-weight: 800;
      color: var(--text-dark);
      background-color: var(--accent-gold);
      border: 2px solid var(--text-dark);
      border-radius: var(--radius-pill);
      box-shadow: 2px 2px 0px var(--accent-orange);
      padding: 0.32rem 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      white-space: nowrap;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background-color: var(--green);
      border: 1px solid var(--text-dark);
      animation: blink 1.4s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .section-label {
      font-family: 'Cooper Black', 'Rockwell', 'Bookman Old Style', Georgia, serif;
      font-size: 1.05rem;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--accent-brown);
      text-shadow: 1.5px 1.5px 0px var(--accent-gold);
      border-bottom: 3.5px solid var(--text-dark);
      box-shadow: 0 3px 0 var(--accent-gold);
      padding-bottom: 0.45rem;
      margin: 1.6rem 0 1rem;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .tx-card {
      background-color: var(--bg-card);
      border: 2.5px solid var(--text-dark);
      border-radius: var(--radius-70s);
      box-shadow: var(--shadow-retro);
      padding: 1.15rem 1.3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .tx-card:hover {
      transform: translate(-1px, -1px);
    }

    .tx-card.highlight {
      border-color: var(--accent-orange);
      background-color: #FFFDF7;
      box-shadow: 5px 5px 0px var(--accent-orange);
    }

    .tx-id {
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--accent-teal);
    }

    .tx-meta {
      font-size: 0.84rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    .tx-amount {
      font-family: 'Courier New', monospace;
      font-size: 1.12rem;
      font-weight: 800;
      color: var(--text-dark);
      margin-top: 0.35rem;
    }

    .tx-actions {
      display: flex;
      gap: 0.6rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn {
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0.55rem 1.05rem;
      cursor: pointer;
      border: 2.5px solid var(--text-dark);
      border-radius: var(--radius-pill);
      box-shadow: var(--shadow-retro-sm);
      transition: transform 0.08s ease, box-shadow 0.08s ease, background-color 0.14s ease;
    }

    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: none;
    }

    .btn-approve {
      background-color: var(--accent-teal);
      color: #FFF8EB;
    }

    .btn-approve:hover {
      background-color: var(--accent-teal-hover);
    }

    .btn-reject {
      background-color: var(--bg-card);
      color: var(--red);
      border-color: var(--red);
      box-shadow: 3px 3px 0px var(--red);
    }

    .btn-reject:hover {
      background-color: var(--red-bg);
    }

    .tag {
      font-family: 'Courier New', monospace;
      font-size: 0.74rem;
      font-weight: 800;
      padding: 0.26rem 0.75rem;
      border: 2px solid var(--text-dark);
      border-radius: var(--radius-pill);
      text-transform: uppercase;
    }

    .tag-paid {
      background-color: var(--green-bg);
      color: var(--green);
    }

    .tag-rejected {
      background-color: var(--red-bg);
      color: var(--red);
    }

    .empty {
      background-color: var(--bg-card);
      border: 2.5px dashed var(--accent-rust);
      border-radius: var(--radius-70s);
      padding: 1.75rem 1.25rem;
      text-align: center;
      font-family: 'Courier New', monospace;
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .log {
      margin-top: 1.5rem;
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-dark);
      text-align: center;
    }

    @media (max-width: 560px) {
      .head {
        padding: 1.15rem;
      }
      .head h1 {
        font-size: 1.2rem;
      }
      .tx-actions {
        width: 100%;
        justify-content: flex-end;
      }
      .head-logo {
      height: 56px;
      width: 56px;
      }
    }
  </style>
</head>
<body>
  <div class="groovy-stripe" aria-hidden="true">
    <span></span><span></span><span></span><span></span>
  </div>

  <div class="wrap">
    <header class="head">
      <div class="head-brand">
        <img src="logo/Planet Vinyl.png" alt="Logo Planet Vinyl" class="head-logo" width="50" height="50">
        <div>
          <h1>QRIS Payment Simulator</h1>
          <p>PLANET VINYL AUDIO &bull; Verifikasi Pembayaran Realtime</p>
        </div>
      </div>
      <span class="live-pill"><span class="dot"></span> LIVE SYNC</span>
    </header>

    <div id="sim-root"></div>
    <div id="sim-log" class="log"></div>
  </div>

  <script src="qris-approve.js"></script>
</body>
</html>
