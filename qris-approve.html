<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QRIS Approve Simulator — NADA KLASIK</title>
  <style>
    :root {
      --bg-cream: #F6ECD9;
      --bg-card: #FFF9EE;
      --text-dark: #2B1B12;
      --text-muted: #6C5341;
      --accent-orange: #D45B27;
      --accent-gold: #E5A93B;
      --accent-teal: #5F6F3A;
      --border-retro: #CEB998;
      --shadow-retro: 4px 4px 0px #2B1B12;
      --green: #2A6F4B;
      --green-bg: #E7F5ED;
      --red: #B83A2D;
      --red-bg: #FBECEB;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-cream);
      background-image: radial-gradient(#D6CBB8 1px, transparent 1px);
      background-size: 24px 24px;
      color: var(--text-dark);
      line-height: 1.5;
      padding: 1.75rem 1rem 3rem;
    }

    .wrap {
      max-width: 680px;
      margin: 0 auto;
    }

    .head {
      background-color: var(--text-dark);
      color: var(--bg-cream);
      border: 2px solid var(--text-dark);
      border-bottom: 4px solid var(--accent-orange);
      box-shadow: var(--shadow-retro);
      padding: 1.1rem 1.25rem;
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .head h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 1.25rem;
      color: var(--accent-gold);
      letter-spacing: 0.5px;
    }

    .head p {
      font-family: 'Courier New', monospace;
      font-size: 0.78rem;
      color: #CFC6B8;
      margin-top: 0.15rem;
    }

    .live-pill {
      font-family: 'Courier New', monospace;
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--text-dark);
      background-color: var(--accent-gold);
      border: 1px solid var(--text-dark);
      padding: 0.25rem 0.65rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      white-space: nowrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--green);
      animation: blink 1.4s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .section-label {
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dark);
      border-bottom: 2px solid var(--text-dark);
      padding-bottom: 0.35rem;
      margin: 1.4rem 0 0.85rem;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .tx-card {
      background-color: var(--bg-card);
      border: 2px solid var(--text-dark);
      box-shadow: var(--shadow-retro);
      padding: 1rem 1.15rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .tx-card.highlight {
      border-color: var(--accent-orange);
      background-color: #FFFBF3;
    }

    .tx-id {
      font-family: 'Courier New', monospace;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--accent-teal);
    }

    .tx-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    .tx-amount {
      font-family: 'Courier New', monospace;
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-dark);
      margin-top: 0.3rem;
    }

    .tx-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .btn {
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0.48rem 0.9rem;
      cursor: pointer;
      border: 2px solid var(--text-dark);
      box-shadow: 2px 2px 0px var(--text-dark);
    }

    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: none;
    }

    .btn-approve {
      background-color: var(--green);
      color: #FFFFFF;
    }

    .btn-reject {
      background-color: var(--bg-card);
      color: var(--red);
    }

    .btn-reject:hover {
      background-color: var(--red-bg);
    }

    .tag {
      font-family: 'Courier New', monospace;
      font-size: 0.74rem;
      font-weight: 700;
      padding: 0.22rem 0.6rem;
      border: 1.5px solid var(--text-dark);
      text-transform: uppercase;
    }

    .tag-paid {
      background-color: var(--green-bg);
      color: var(--green);
    }

    .tag-rejected {
      background-color: var(--red-bg);
      color: var(--red);
    }

    .empty {
      background-color: var(--bg-card);
      border: 2px dashed var(--border-retro);
      padding: 1.5rem 1rem;
      text-align: center;
      font-family: 'Courier New', monospace;
      font-size: 0.84rem;
      color: var(--text-muted);
    }

    .log {
      margin-top: 1.35rem;
      font-family: 'Courier New', monospace;
      font-size: 0.78rem;
      color: var(--text-dark);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="head">
      <div>
        <h1>QRIS Payment Simulator</h1>
        <p>NADA KLASIK AUDIO &bull; Verifikasi Pembayaran Realtime</p>
      </div>
      <span class="live-pill"><span class="dot"></span> LIVE SYNC</span>
    </header>

    <div id="sim-root"></div>
    <div id="sim-log" class="log"></div>
  </div>

  <script src="qris-approve.js"></script>
</body>
</html>
